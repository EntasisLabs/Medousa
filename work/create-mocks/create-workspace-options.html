<script>
(() => {
 const root=document.getElementById('create-mocks');
 const template=root.querySelector('#create-shell-template');
 const saved=window.openai?.widgetState;
 const initial=saved?.privateContent?.variants||{};
 const remembered={};
 const instances={};
 const texts={original:'Made for the way<br>you work.',warm:'Your ideas.<br>In motion.',bold:'Less friction.<br>More making.'};
 const palettes={original:['#e5e9dc','#333b2e'],warm:['#e6ddce','#403a2e'],bold:['#c9bfd9','#332d43']};
 const persist=()=>{window.openai?.setWidgetState?.({modelContent:{mock:'Create workspace',choices:remembered},privateContent:{variants:remembered}})?.catch(()=>{});};
 root.querySelectorAll('[data-layout]').forEach(section=>{
   section.append(template.content.cloneNode(true));
   const layout=section.dataset.layout;
   const app=section.querySelector('.md-app');
   const art=section.querySelector('.md-art');
   const ask=section.querySelector('.md-ask');
   const panel=section.querySelector('.md-inspector');
   const reply=section.querySelector('.md-reply');
   const state={selection:'title',target:'Medousa',preview:'original',accepted:'original',panel:layout!=='canvas',mode:'editor',draft:'',resultOpen:false,...initial[layout]};
   const sync=()=>{remembered[layout]={...state};persist();};
   const draw=()=>{
     app.classList.toggle('md-mode-home',state.mode==='home');app.classList.toggle('md-mode-notes',state.mode==='notes');
     panel.classList.toggle('is-open',state.panel);
     reply.classList.toggle('is-visible',state.resultOpen);
     section.querySelector('.md-reply-header span').textContent=state.target+' · Preview';
     art.dataset.selected=state.selection;
     const treatment=palettes[state.preview]||palettes.original;
     art.style.background=treatment[0];art.style.color=treatment[1];
     section.querySelector('.md-headline').innerHTML=texts[state.preview]||texts.original;
     section.querySelector('.md-embed-preview').innerHTML=texts[state.accepted]||texts.original;
     section.querySelector('.md-target').firstChild.textContent='@'+state.target;
     section.querySelector('.md-selected-name').textContent=state.selection==='title'?'Headline':'Spotlight screenshot';
     section.querySelector('.md-context-text').textContent=(state.selection==='title'?'Headline selected · text + frame preview':'Screenshot selected · image + frame preview')+(layout==='references'?' · 2 references':'');
     section.querySelectorAll('[data-preview]').forEach(b=>b.classList.toggle('is-chosen',b.dataset.preview===state.preview));
     const input=ask.querySelector('input');if(document.activeElement!==input)input.value=state.draft;
   };
   const toast=(message)=>{section.querySelector('.md-canvas .md-toast').textContent=message;};
   draw();remembered[layout]={...state};instances[layout]={state,draw};
   const preview=()=>{state.resultOpen=true;state.preview='warm';section.querySelector('.md-result-text').textContent=state.selection==='title'?'Two headline directions. Your original is still here.':'Two composition directions. The source image stays untouched.';toast('Previewing a suggestion · not applied');draw();sync();};
   ask.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();preview();}});
   ask.querySelector('input').addEventListener('input',e=>{state.draft=e.target.value;sync();});
   section.addEventListener('click',e=>{
     const button=e.target.closest('button');if(!button)return;
     const action=button.dataset.action;
     if(action==='preview')preview();
     if(button.dataset.preview){state.preview=button.dataset.preview;toast('Previewing '+button.textContent.toLowerCase()+' · not applied');}
     if(button.dataset.target){state.target=button.dataset.target;section.querySelector('.md-target-menu').classList.remove('is-visible');}
     if(button.dataset.starter){state.mode='editor';state.draft='';toast(button.dataset.starter+' starter · sample project preview');}
     if(button.dataset.tool){section.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('is-active',b===button));toast({select:'Select an object on the canvas',ink:'Ink · draw directly on the canvas',text:'Text · click to place editable type',shape:'Shape · rectangle selected',frame:'Frame · release graphic selected'}[button.dataset.tool]);}
     if(action==='home')state.mode='home';
     if(action==='notes')state.mode='notes';
     if(action==='open')state.mode='editor';
     if(action==='panel')state.panel=!state.panel;
     if(action==='targets')section.querySelector('.md-target-menu').classList.toggle('is-visible');
     if(action==='select-title')state.selection='title';
     if(action==='select-image')state.selection='image';
     if(action==='apply'){state.accepted=state.preview;state.resultOpen=false;toast('Applied to this frame · undo available');}
     if(action==='undo'){state.preview='original';state.accepted='original';state.resultOpen=false;toast('Restored original · source assets preserved');}
     if(action==='export')toast('Release graphic · PNG · 1200 × 920 · export preview');
     draw();sync();
   });
   if(globalThis.Tweak){const settings={showContext:state.panel,showAsk:true};const tweaks=new Tweak({container:app,onChange:()=>{state.panel=settings.showContext;ask.hidden=!settings.showAsk;draw();}});tweaks.addToggle(settings,'showContext',{label:layout==='references'?'References panel':'Selection panel'});tweaks.addToggle(settings,'showAsk',{label:'Contextual Ask'});}
 });
 window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent?.variants;if(next){Object.assign(remembered,next);for(const [name,value] of Object.entries(next)){if(instances[name]){Object.assign(instances[name].state,value);instances[name].draw();}}}});
 if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
