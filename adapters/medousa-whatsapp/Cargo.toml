[package]
name = "medousa-whatsapp"
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "medousa_whatsapp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
buffa = "0.9"
dirs = "5"
log = "0.4"
prost = "0.14"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }
whatsapp-rust-tokio-transport = "0.7"
whatsapp-rust-ureq-http-client = "0.7"
wacore = { version = "0.7", default-features = false }
wacore-binary = { version = "0.7", default-features = false }
waproto = "0.7"

[package.metadata.cargo-machete]
ignored = ["serde_json"]
