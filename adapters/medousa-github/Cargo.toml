[package]
name = "medousa-github"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Optional GitHub repository review provider for Medousa"

[[bin]]
name = "medousa_review_github"
path = "src/main.rs"

[dependencies]
medousa-types = { path = "../../crates/medousa-types" }
medousa-forge = { path = "../../crates/medousa-forge" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "io-util", "io-std", "net", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
