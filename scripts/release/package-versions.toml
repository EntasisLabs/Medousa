# Per-package release versions (channel artifact stamps).
# Bump only the packages you ship. Full `v*` tags require every stamp equal to the tag.
# workflow_dispatch ship_all with mixed stamps auto-ships packages at the channel head.
#
# Archive names: {id}-v{version}-{target}.tar.gz
# Channel head (top-level release-manifest.version) is computed at publish time.
#
# engine = medousa + medousa_daemon + medousa_cli + medousa_tui

[packages]
engine = "0.7.2"
adapter-telegram = "0.7.2"
adapter-discord = "0.7.2"
adapter-slack = "0.7.2"
adapter-whatsapp = "0.7.2"
mcp-gateway = "0.7.2"
coding-engine = "0.7.2"
shell-session = "0.7.2"
local-brain = "0.7.2"
desktop = "0.7.2"
installer = "0.7.2"
