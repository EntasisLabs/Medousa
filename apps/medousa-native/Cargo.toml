[package]
name = "medousa-native"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone native application, like the Tauri shell.
[workspace]

[features]
# Artifacts are a core Medousa feature; RNDR itself keeps this backend opt-in.
# Use --no-default-features for a build without native HTML preview.
default = ["macos-private-webkit-artifacts"]
# Private WebKit SPI: not App Store/public-API-only.
macos-private-webkit-artifacts = ["dep:rndr_browser", "rndr_browser/macos-private-webkit-artifacts"]

[dependencies]
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
rndr_core = { path = "../../../../rndr/crates/rndr_core" }
rndr_term = { path = "../../../../rndr/crates/rndr_term" }
rndr_ui = { path = "../../../../rndr/crates/rndr_ui" }
rndr_markdown = { path = "../../../../rndr/crates/rndr_markdown" }
rndr_canvas = { path = "../../../../rndr/crates/rndr_canvas" }
rndr_canvas_ui = { path = "../../../../rndr/crates/rndr_canvas_ui" }
rndr_markdown_ui = { path = "../../../../rndr/crates/rndr_markdown_ui" }
rndr_paint = { path = "../../../../rndr/crates/rndr_paint", features = ["highlight"] }
rndr_render = { path = "../../../../rndr/crates/rndr_render", default-features = false, features = ["parley", "accesskit", "svg"] }
medousa-sdk = { path = "../../crates/medousa-sdk", default-features = false, features = ["async", "sse"] }
medousa-app-core = { path = "../../crates/medousa-app-core" }
medousa-desktop-host = { path = "../../crates/medousa-desktop-host", features = ["legacy-client-network"] }
medousa-types = { path = "../../crates/medousa-types" }
medousa-local-credential = { path = "../../crates/medousa-local-credential" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
base64 = "0.22"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
serde = "1"
serde_json = "1"
chrono = "0.4"
mime_guess = "2"
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

bytes = "1"
sha2 = "0.10"
[target.'cfg(target_os = "macos")'.dependencies]
rndr_browser = { path = "../../../../rndr/crates/rndr_browser", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

# Interactive builds must optimize the renderer/text stack too. Debug assertions
# remain on; this is not a substitute for application hot-path fixes.
[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
debug = 0
incremental = false
