schema = "medousa.connector/v1"
id = "github"
title = "GitHub"
publisher = "GitHub"
version = "1.0.0"
categories = ["developer"]
source = "https://github.com/github/github-mcp-server"

[transport]
kind = "remote"
url = "https://api.githubcopilot.com/mcp/"

[auth]
kind = "oauth"
# No public client id is committed. Register an Entasis app or supply your own.
clients = ["preregistered", "byo"]
scopes = []
offline_access = true

[tools]
default_excluded = ["delete_*"]

[tools.effects]
send_message = "external_side_effect"

[skill]
path = "SKILL.md"

[suggest]
keywords = ["github", "pull request", "issue"]
hosts = ["github.com"]

[platforms]
desktop = true
mobile = true
