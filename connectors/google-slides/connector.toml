schema = "medousa.connector/v1"
id = "google-slides"
title = "Google Slides"
publisher = "Google"
version = "1.0.0"
categories = ["design"]
source = "https://developers.google.com/workspace/guides/configure-mcp-servers"

[transport]
kind = "remote"
url = "https://slidesmcp.googleapis.com/mcp/v1"
elicitation_fallback_url = "https://slidesmcp.googleapis.com/mcp/v1self"

[auth]
kind = "oauth"
# Tried in order. No client id is shipped: Entasis registers an AI-agent
# Desktop/iOS/Android client, or the user supplies their own (Personal mode).
clients = ["preregistered", "byo"]
scopes = [
  "https://www.googleapis.com/auth/presentations",
]
offline_access = true
access_type_offline = true
google_agent_client = true

[tools]
default_excluded = ["delete_*"]


[skill]
path = "SKILL.md"

[suggest]
keywords = ["slides", "presentation"]
hosts = ["docs.google.com"]

[platforms]
desktop = true
mobile = true
