schema = "medousa.connector/v1"
id = "hubspot"
title = "HubSpot"
publisher = "HubSpot"
version = "1.0.0"
categories = ["commerce"]
source = "https://developers.hubspot.com/mcp"

[transport]
kind = "remote"
url = "https://mcp.hubspot.com"

[auth]
kind = "oauth"
# No public client id is committed. Register an Entasis app or supply your own.
clients = ["preregistered", "byo"]
scopes = []
offline_access = true

[tools]
default_excluded = ["delete_*"]

[tools.effects]
send_message = "external_side_effect"

[skill]
path = "SKILL.md"

[suggest]
keywords = ["hubspot", "crm"]
hosts = ["hubspot.com"]

[platforms]
desktop = true
mobile = true
