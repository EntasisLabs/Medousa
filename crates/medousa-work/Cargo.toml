[package]
name = "medousa-work"
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Durable user-domain relationships and session-independent work scopes"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
medousa-store = { path = "../medousa-store" }
medousa-types = { path = "../medousa-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
