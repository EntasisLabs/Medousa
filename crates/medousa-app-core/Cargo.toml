[package]
name = "medousa-app-core"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Renderer-agnostic Medousa application core (chat, shell layout, vault buffers)"
repository = "https://github.com/EntasisLabs/Medousa"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
medousa-types = { path = "../medousa-types" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", optional = true, features = ["chrono"] }
thiserror = "2"

[features]
default = []
json-schema = ["dep:schemars", "medousa-types/json-schema"]

[[bin]]
name = "medousa-app-core-schema"
path = "src/bin/export_schema.rs"
required-features = ["json-schema"]

[[bin]]
name = "app-chat-dispatch"
path = "src/bin/app_chat_dispatch.rs"

[[bin]]
name = "app-shell-dispatch"
path = "src/bin/app_shell_dispatch.rs"

[[bin]]
name = "app-vault-buffer-dispatch"
path = "src/bin/app_vault_buffer_dispatch.rs"

[dev-dependencies]
serde_json = "1"
