[package]
name = "medousa-tool-macros"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "State-preserving typed tool adapter macro for Medousa"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
async-trait = "0.1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
