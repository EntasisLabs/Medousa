[package]
name = "medousa-cli"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Command-line client for the Medousa daemon"

[[bin]]
name = "medousa_cli"
path = "src/main.rs"

[features]
iroh-transport = ["dep:medousa-iroh-http"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
medousa-adapter-common = { path = "../medousa-adapter-common" }
medousa-iroh-http = { path = "../medousa-iroh-http", optional = true }
medousa-local-credential = { path = "../medousa-local-credential" }
medousa-types = { path = "../medousa-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
