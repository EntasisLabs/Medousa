[package]
name = "medousa-browser"
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "wasm-bindgen page bridge for the browser workshop"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
medousa = { path = "../..", default-features = false, features = ["wasm-daemon"] }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = "1"
