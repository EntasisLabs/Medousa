[package]
name = "medousa-computer"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Colocated native computer driver for governed Medousa worlds"

[[bin]]
name = "medousa-computer"
path = "src/main.rs"

[dependencies]
medousa-computer-bridge = { path = "../medousa-computer-bridge" }
medousa-world = { path = "../medousa-world" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
block2 = "0.6"
image = { version = "0.25.6", default-features = false, features = ["png"] }
libc = "0.2"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFData", "std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGDataProvider", "CGImage", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSError", "NSString", "std"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["SCScreenshotManager", "SCShareableContent", "SCStream", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "std"] }
sha2 = "0.10"
