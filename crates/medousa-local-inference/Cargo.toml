[package]
name = "medousa-local-inference"
version = "0.8.0"
edition = "2024"
description = "Local inference catalog/hardware/engine logic and the standalone medousa_local offline-brain binary (isolated from the medousa app crate)"

[[bin]]
name = "medousa_local"
path = "src/bin/medousa_local.rs"

[[bin]]
name = "medousa_local_bench"
path = "src/bin/medousa_local_bench.rs"
required-features = ["embedded-inference"]

[dependencies]
medousa-types = { path = "../medousa-types" }
medousa-host = { path = "../medousa-host" }
medousa-install-support = { path = "../medousa-install-support" }
medousa-local-engine = { path = "../medousa-local-engine", optional = true }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
fs2 = "0.4"
dirs = "5"
libloading = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ash = { version = "0.38", default-features = false, features = ["loaded"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
default = []
embedded-inference = ["dep:medousa-local-engine", "dep:reqwest"]
telemetry-metal = ["dep:metal"]
embedded-inference-metal = ["embedded-inference", "medousa-local-engine/metal", "telemetry-metal"]
embedded-inference-cuda = ["embedded-inference", "medousa-local-engine/cuda"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
