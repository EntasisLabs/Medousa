[package]
name = "medousa-desktop-host"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared non-Tauri desktop connection and local engine policy"

[dependencies]
medousa-types = { path = "../medousa-types" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
medousa-host = { path = "../medousa-host" }

[dev-dependencies]
tempfile = "3"
