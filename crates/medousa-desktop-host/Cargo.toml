[package]
name = "medousa-desktop-host"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared non-Tauri desktop connection and local engine policy"

[dependencies]
medousa-types = { path = "../medousa-types" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["sync", "time"] }

medousa-sdk = { path = "../medousa-sdk", default-features = false, features = ["async"] }
medousa-sdk-iroh = { path = "../medousa-sdk-iroh", default-features = false, features = ["async", "sse"] }
medousa-iroh-http = { path = "../medousa-iroh-http" }
medousa-secrets = { path = "../medousa-secrets" }
medousa-local-credential = { path = "../medousa-local-credential" }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"
bytes = "1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
medousa-host = { path = "../medousa-host" }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
