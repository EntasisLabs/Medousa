[package]
name = "medousa-iroh-http"
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "HTTP/1.1 over Iroh QUIC — shared client for engine and mobile"

[dependencies]
anyhow = "1"
httparse = "1"
iroh = "1.0"
iroh-tickets = "1.0"
tokio = { version = "1", features = ["sync", "time"] }
url = "2.5"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
