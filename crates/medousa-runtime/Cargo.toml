[package]
name = "medousa-runtime"
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Portable Medousa foreground turn runtime and policy kernel"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
genai = "0.6.5"
medousa-engine = { path = "../medousa-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stasis-rs = { version = "=0.9.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
