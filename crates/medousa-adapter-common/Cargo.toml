[package]
name = "medousa-adapter-common"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared ingest delivery helpers for Medousa channel adapters"

[dependencies]
anyhow = "1"
futures-util = "0.3"
medousa-sdk = { path = "../medousa-sdk", default-features = false, features = ["async", "sse"] }
medousa-types = { path = "../medousa-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
telegram-escape = "0.4.0"
tokio = { version = "1", features = ["time"] }
