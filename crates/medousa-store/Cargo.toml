[package]
name = "medousa-store"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared capability-confined store root, receipts, and file transactions for Medousa stores"

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3"
