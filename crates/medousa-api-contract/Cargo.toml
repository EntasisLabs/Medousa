[package]
name = "medousa-api-contract"
version = "0.10.0"
edition = "2024"
description = "Route-owned daemon API IR, OpenAPI generation, and client codecs"
publish = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "medousa-api-contract"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
