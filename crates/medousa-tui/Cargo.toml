[package]
name = "medousa-tui"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal client for the Medousa daemon"

[[bin]]
name = "medousa_tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "5"
futures-util = "0.3"
libc = "0.2"
mdns-sd = "0.11"
medousa-local-credential = { path = "../medousa-local-credential" }
medousa-sdk = { path = "../medousa-sdk" }
medousa-types = { path = "../medousa-types" }
ratatui = "0.30.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
vte = { version = "0.15", default-features = false }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
