[package]
name = "medousa-session"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Medousa workshop shell session host — one PTY per session, shared by Home and agents"

[[bin]]
name = "medousa-session"
path = "src/bin/medousa-session.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.cargo-machete]
ignored = ["async-trait", "thiserror"]
