[package]
name = "medousa-forge"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Forge — Medousa's version-controlled work lifecycle engine. User-owned work items, governed git environments, lease-fenced executor attempts, sealed evidence, human review, durable dispositions."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
globset = "0.4"
medousa-host = { path = "../medousa-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
