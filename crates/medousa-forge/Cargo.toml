[package]
name = "medousa-forge"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Forge — Medousa's version-controlled work lifecycle engine. User-owned work items, governed git environments, lease-fenced executor attempts, sealed evidence, human review, durable dispositions."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
