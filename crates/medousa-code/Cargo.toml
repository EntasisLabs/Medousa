[package]
name = "medousa-code"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Medousa LSP Interoperability Orchestrator — many language servers, many clients, one workshop disk"

[[bin]]
name = "medousa-code"
path = "src/bin/medousa-code.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
grapheme-lsp = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
