[package]
name = "medousa-host"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Host OS utilities for Medousa (process spawn, binary resolution)"

[dependencies]
medousa-types = { path = "../medousa-types" }
dirs = "5"
tokio = { version = "1", features = ["process", "time"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
