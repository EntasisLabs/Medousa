[package]
name = "medousa-secrets"
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Typed OS keyring and owner-only file fallback for Medousa secrets"

[dependencies]
anyhow = "1"
keyring = "2.3"
medousa-types = { path = "../medousa-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
