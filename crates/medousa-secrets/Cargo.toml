[package]
name = "medousa-secrets"
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Typed OS keyring + owner-only file secret store for Medousa"

[dependencies]
anyhow = "1"
keyring = "2.3"
medousa-types = { path = "../medousa-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
