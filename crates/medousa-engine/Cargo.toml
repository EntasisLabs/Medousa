[package]
name = "medousa-engine"
version = "0.9.1"
edition = "2024"
description = "Medousa turn engine: typed events, durable spine, and outbound ports"

[dependencies]
medousa-types = { path = "../medousa-types" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
