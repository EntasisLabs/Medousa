name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude medousa-sdk-iroh -- -D warnings
      - name: cargo test (lib)
        run: cargo test -p medousa --lib

  home:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/medousa-home
    steps:
      - uses: actions/checkout@v5
      - name: Guard wmi windows/windows-core lock alignment
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/check-wmi-windows-alignment.sh
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/medousa-home/package-lock.json
      - run: npm ci
      - run: npm run check

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            integrations/vscode/package-lock.json
            integrations/obsidian/package-lock.json
            integrations/browser/package-lock.json
      - name: Install Neovim v0.10.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/neovim/neovim/releases/tags/v0.10.4)"
          asset_id="$(jq -r '.assets[] | select(.name == "nvim-linux-x86_64.tar.gz") | .id' <<<"${release_json}")"
          [[ "${asset_id}" =~ ^[0-9]+$ ]]
          archive="${RUNNER_TEMP}/nvim-linux-x86_64.tar.gz"
          curl --fail --location --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/neovim/neovim/releases/assets/${asset_id}" \
            -o "${archive}"
          echo "95aaa8e89473f5421114f2787c13ae0ec6e11ebbd1a13a1bd6fcf63420f8073f  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/nvim-linux-x86_64/bin" >> "${GITHUB_PATH}"
      - name: Install integration dependencies
        run: |
          npm ci --prefix integrations/vscode
          npm ci --prefix integrations/obsidian
          npm ci --prefix integrations/browser
      - name: Build and test Node integrations
        run: |
          npm run build --prefix integrations/vscode
          npm test --prefix integrations/vscode
          npm run build --prefix integrations/obsidian
          npm test --prefix integrations/obsidian
          npm run build --prefix integrations/browser
          npm test --prefix integrations/browser
      - name: Test Neovim integration
        env:
          NVIM_LOG_FILE: /tmp/medousa-nvim.log
        run: |
          nvim --headless -n -i NONE -u NONE --cmd 'set rtp+=integrations/neovim' -l integrations/neovim/tests/smoke.lua
          nvim --headless -n -i NONE -u NONE --cmd 'set rtp+=integrations/neovim' -l integrations/neovim/tests/ui_smoke.lua
      - name: Verify release bundles
        run: ./scripts/release/package-integrations.sh --output dist/integrations

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: verify docs (advisory)
        run: bash scripts/verify-docs.sh
        continue-on-error: true

  sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install pyyaml
        run: pip install pyyaml
      - name: check SDK contract
        run: bash scripts/check-sdk-contract.sh

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - name: cargo test medousa-sdk
        run: cargo test -p medousa-sdk --features async,sse,blocking

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/medousa-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install package
        run: pip install -e ".[dev]"
      - name: export JSON schema and verify generated types
        working-directory: .
        run: |
          cargo run -p medousa-types-schema
          python scripts/gen-python-types.py
          git diff --exit-code python/medousa-sdk/src/medousa/types/_generated/ || (echo "Run scripts/gen-python-types.py" && exit 1)
      - name: ruff check
        working-directory: python/medousa-sdk
        run: ruff check .
      - name: pytest
        working-directory: python/medousa-sdk
        run: pytest
