name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Guard request-scoped runtime ownership
        run: ./scripts/ci/check-runtime-context.sh
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude medousa-sdk-iroh -- -D warnings
      - name: cargo test (lib, hermetic)
        timeout-minutes: 25
        run: ./scripts/ci/test-hermetic.sh
      - name: cargo test (workspace lib)
        timeout-minutes: 25
        run: cargo test --workspace --exclude medousa-sdk-iroh --lib

  rust-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: cargo deny
        run: cargo deny check
      - name: unused direct dependencies
        run: ./scripts/ci/check-unused-deps.sh
      - name: P09 dependency budget
        run: ./scripts/ci/check-dependency-budget.sh

  ios-embedded-deps:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Check iOS embedded dependency slices
        run: ./scripts/ci/check-ios-embedded-deps.sh

  tauri-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/medousa-home/src-tauri -> apps/medousa-home/src-tauri/target
          cache-on-failure: true
      - name: Install Tauri build deps
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo clippy (Home Tauri)
        run: cargo clippy --manifest-path apps/medousa-home/src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code -A clippy::too_many_arguments -A clippy::large_enum_variant -A clippy::ptr_arg -A private_interfaces
      - name: cargo test (Home Tauri lib)
        run: cargo test --manifest-path apps/medousa-home/src-tauri/Cargo.toml --lib

  perf-micro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - name: P01/P03 micro-CI budgets
        run: ./scripts/ci/check-perf-budgets.sh

  filesystem-authority:
    name: Filesystem authority (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Test root filesystem authority
        run: "cargo test -p medousa --lib store_root::tests::"
      - name: Test held-authority journals
        run: "cargo test -p medousa-engine turn_event_log::tests::"
      - name: Test held-authority model payloads
        run: "cargo test -p medousa-install-support model_download::tests::"
      - name: Test in-process MinGit extraction (Windows)
        if: runner.os == 'Windows'
        run: "cargo test -p medousa --lib vault_git::install::tests::"

  home:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/medousa-home
    steps:
      - uses: actions/checkout@v5
      - name: Guard wmi windows/windows-core lock alignment
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/check-wmi-windows-alignment.sh
      - name: Check streamed CLI installer
        working-directory: ${{ github.workspace }}
        run: ./scripts/ci/check-streamed-install.sh
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/medousa-home/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:h09
      - run: npm run build
      - run: npm run check:bundle-budget

  browser-authority:
    name: Browser authority (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/medousa-home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/medousa-home/package-lock.json
      - run: npm ci
      - name: Verify shipped browser authority, CSP, and resource boundary
        run: npm run check:browser-capabilities

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            integrations/vscode/package-lock.json
            integrations/obsidian/package-lock.json
            integrations/browser/package-lock.json
      - name: Install Neovim v0.10.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/neovim/neovim/releases/tags/v0.10.4)"
          asset_id="$(jq -r '.assets[] | select(.name == "nvim-linux-x86_64.tar.gz") | .id' <<<"${release_json}")"
          [[ "${asset_id}" =~ ^[0-9]+$ ]]
          archive="${RUNNER_TEMP}/nvim-linux-x86_64.tar.gz"
          curl --fail --location --silent --show-error --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/neovim/neovim/releases/assets/${asset_id}" \
            -o "${archive}"
          echo "95aaa8e89473f5421114f2787c13ae0ec6e11ebbd1a13a1bd6fcf63420f8073f  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/nvim-linux-x86_64/bin" >> "${GITHUB_PATH}"
      - name: Install integration dependencies
        run: |
          npm ci --prefix integrations/vscode
          npm ci --prefix integrations/obsidian
          npm ci --prefix integrations/browser
      - name: Build and test Node integrations
        run: |
          npm run build --prefix integrations/vscode
          npm test --prefix integrations/vscode
          npm run build --prefix integrations/obsidian
          npm test --prefix integrations/obsidian
          npm run build --prefix integrations/browser
          npm test --prefix integrations/browser
      - name: Test Neovim integration
        env:
          NVIM_LOG_FILE: /tmp/medousa-nvim.log
        run: |
          nvim --headless -n -i NONE -u NONE --cmd 'set rtp+=integrations/neovim' -l integrations/neovim/tests/smoke.lua
          nvim --headless -n -i NONE -u NONE --cmd 'set rtp+=integrations/neovim' -l integrations/neovim/tests/ui_smoke.lua
      - name: Verify release bundles
        run: ./scripts/release/package-integrations.sh --output dist/integrations

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: verify docs
        run: bash scripts/verify-docs.sh --strict

  sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - name: check generated API contract
        run: bash scripts/check-api-contract.sh

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - name: cargo test medousa-sdk
        run: cargo test -p medousa-sdk --features async,sse,blocking

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/medousa-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> .cache/cargo-target
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install package
        run: pip install -e ".[dev]"
      - name: export JSON schema and verify generated types
        working-directory: .
        run: |
          cargo run -p medousa-types-schema
          python scripts/gen-python-types.py
          git diff --exit-code python/medousa-sdk/src/medousa/types/_generated/ || (echo "Run scripts/gen-python-types.py" && exit 1)
      - name: ruff check
        working-directory: python/medousa-sdk
        run: ruff check .
      - name: pytest
        working-directory: python/medousa-sdk
        run: pytest
