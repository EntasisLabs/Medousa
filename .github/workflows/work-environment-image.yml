name: Work environment image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/work-environment/Containerfile
      - .github/workflows/work-environment-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: work-environment-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/entasislabs/medousa-work-environment

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: config/work-environment
          file: config/work-environment/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record immutable reference
        run: |
          echo '### Medousa work-environment image' >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
