[package]
name = "medousa"
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EntasisLabs/Medousa"
homepage = "https://github.com/EntasisLabs/Medousa"
description = "Permanent AI workspace — Medousa Engine and related crates"

[workspace]
members = [
    ".",
    "crates/medousa-types",
    "crates/medousa-types-schema",
    "crates/medousa-api-contract",
    "crates/medousa-tool-macros",
    "crates/medousa-engine",
    "crates/medousa-ios-dependency-probe",
    "crates/medousa-sdk",
    "crates/medousa-sdk-iroh",
    "crates/medousa-iroh-http",
    "crates/medousa-local-engine",
    "crates/medousa-local-inference",
    "crates/medousa-host",
    "crates/medousa-store",
    "crates/medousa-browser-lite",
    "crates/medousa-browser-bridge",
    "crates/medousa-install-support",
    "crates/medousa-local-credential",
    "crates/medousa-secrets",
    "crates/medousa-mcp-server",
    "crates/medousa-acp-client",
    "crates/medousa-adapter-common",
    "crates/medousa-forge",
    "crates/medousa-code",
    "crates/medousa-session",
    "adapters/medousa-telegram",
    "adapters/medousa-discord",
    "adapters/medousa-slack",
    "adapters/medousa-mcp-gateway",
]
exclude = ["apps/medousa-home/src-tauri", "apps/medousa-installer/src-tauri"]

[[bin]]
name = "medousa_cli"
path = "src/bin/medousa_cli.rs"

[[bin]]
name = "medousa"
path = "src/bin/medousa.rs"

[[bin]]
name = "medousa_daemon"
path = "src/bin/medousa_daemon.rs"

[[bin]]
name = "medousa_tui"
path = "src/bin/medousa_tui.rs"

[[example]]
name = "p03_feed_workspace"
path = "examples/p03_feed_workspace.rs"

[[example]]
name = "p06_vault_backend"
path = "examples/p06_vault_backend.rs"

[dependencies]
medousa-types = { path = "crates/medousa-types", features = ["json-schema"] }
medousa-api-contract = { path = "crates/medousa-api-contract" }
medousa-tool-macros = { path = "crates/medousa-tool-macros" }
medousa-adapter-common = { path = "crates/medousa-adapter-common" }
medousa-mcp-gateway = { path = "adapters/medousa-mcp-gateway" }
medousa-install-support = { path = "crates/medousa-install-support" }
medousa-local-credential = { path = "crates/medousa-local-credential" }
medousa-secrets = { path = "crates/medousa-secrets" }
medousa-engine = { path = "crates/medousa-engine" }
medousa-host = { path = "crates/medousa-host" }
medousa-store = { path = "crates/medousa-store" }
medousa-sdk = { path = "crates/medousa-sdk" }
medousa-acp-client = { path = "crates/medousa-acp-client" }
medousa-forge = { path = "crates/medousa-forge" }
detamu = { version = "0.1.1", default-features = false, features = ["code", "surreal"] }
detamu-source-git = "0.1.1"
detamu-language-rust = "0.1.1"
detamu-language = "0.1.1"
medousa-browser-lite = { path = "crates/medousa-browser-lite" }
medousa-local-inference = { path = "crates/medousa-local-inference" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
icalendar = { version = "0.17", default-features = true, features = ["chrono-tz"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "blocking"] }
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
ratatui = "0.30.0"
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
stasis-rs = { version = "0.9.3", features = ["otel", "grapheme-full"] }
grapheme-sdk = { version = "0.7.1", default-features = false, features = ["host"] }
grapheme-compiler = { version = "0.7.1", default-features = false }
grapheme-runtime = { version = "0.7.1", default-features = false }
grapheme-lsp = "0.7.1"
schemars = "0.8"
genai = "0.6.5"
keyring = "2.3"
locus-core-rs = "0.5.0"
once_cell = "1"
surrealdb-types = { version = "3.1.5" }
surrealdb = { version = "3.1.5", default-features = false, features = ["kv-surrealkv", "rustls", "kv-mem", "protocol-ws"] }
toml = "0.8"
serde_yaml = "0.9"
libc = "0.2"
sha2 = "0.10"
hmac = "0.12"
regex = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
qrcode = "0.14"
a2 = { version = "0.10", default-features = false, features = ["ring"] }
mdns-sd = "0.11"
chacha20poly1305 = { version = "0.10", features = ["std"] }
urlencoding = "2"
sysinfo = "0.33"
fs2 = "0.4"
flate2 = "1"
calamine = "0.36"
pdf-extract = "0.12"
iroh = { version = "1.0", optional = true }
iroh-tickets = { version = "1.0", optional = true }
httparse = { version = "1", optional = true }
medousa-iroh-http = { path = "crates/medousa-iroh-http", optional = true }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
vte = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"], optional = true }
notify = "6"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
rappct = "0.13.3"

[features]
default = []
otel-export = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
iroh-transport = ["dep:iroh", "dep:iroh-tickets", "dep:httparse", "dep:medousa-iroh-http"]

[dev-dependencies]
medousa-mcp-server = { path = "crates/medousa-mcp-server" }
surrealdb-types = { version = "3.1.5" }
surrealdb = { version = "3.1.5", default-features = false, features = ["kv-mem"] }
tempfile = "3"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

# --- Local iteration speed -------------------------------------------------
# Debug info generation + dsymutil + linking dominate build time on a workspace
# this dependency-heavy. Keep line tables (backtraces still work) but drop the
# heavy DWARF, never emit debuginfo for dependencies, and skip dsymutil on macOS.
# These only affect the dev/test profile — release/shipped binaries are untouched.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# Cross-target qualification profile for the embedded iOS dependency graph.
# Staticlib probes need codegen and linking, but do not need the size or disk
# cost of release LTO or debug information.
[profile.ios-probe]
inherits = "release"
opt-level = "s"
debug = false
strip = "debuginfo"
lto = false
codegen-units = 16
incremental = false
panic = "abort"

[package.metadata.cargo-machete]
ignored = []
