[package]
name = "medousa"
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EntasisLabs/Medousa"
homepage = "https://github.com/EntasisLabs/Medousa"
description = "Permanent AI workspace — Medousa Engine and related crates"

[workspace]
members = [
    ".",
    "crates/medousa-types",
    "crates/medousa-types-schema",
    "crates/medousa-api-contract",
    "crates/medousa-tool-macros",
    "crates/medousa-engine",
    "crates/medousa-runtime",
    "crates/medousa-ios-dependency-probe",
    "crates/medousa-sdk",
    "crates/medousa-sdk-iroh",
    "crates/medousa-iroh-http",
    "crates/medousa-local-engine",
    "crates/medousa-local-inference",
    "crates/medousa-host",
    "crates/medousa-store",
    "crates/medousa-browser-lite",
    "crates/medousa-browser-bridge",
    "crates/medousa-install-support",
    "crates/medousa-local-credential",
    "crates/medousa-secrets",
    "crates/medousa-mcp-server",
    "crates/medousa-acp-client",
    "crates/medousa-adapter-common",
    "crates/medousa-forge",
    "crates/medousa-code",
    "crates/medousa-session",
    "adapters/medousa-telegram",
    "adapters/medousa-discord",
    "adapters/medousa-slack",
    "adapters/medousa-mcp-gateway",
]
exclude = ["apps/medousa-home/src-tauri", "apps/medousa-installer/src-tauri"]

[[bin]]
name = "medousa_cli"
path = "src/bin/medousa_cli.rs"
required-features = ["full-daemon"]

[[bin]]
name = "medousa"
path = "src/bin/medousa.rs"
required-features = ["full-daemon"]

[[bin]]
name = "medousa_daemon"
path = "src/bin/medousa_daemon.rs"
required-features = ["full-daemon"]

[[bin]]
name = "medousa_tui"
path = "src/bin/medousa_tui.rs"
required-features = ["full-daemon"]

[[example]]
name = "p03_feed_workspace"
path = "examples/p03_feed_workspace.rs"
required-features = ["full-daemon"]

[[example]]
name = "p06_vault_backend"
path = "examples/p06_vault_backend.rs"
required-features = ["full-daemon"]

[dependencies]
medousa-types = { path = "crates/medousa-types" }
medousa-api-contract = { path = "crates/medousa-api-contract", optional = true }
medousa-tool-macros = { path = "crates/medousa-tool-macros", optional = true }
medousa-adapter-common = { path = "crates/medousa-adapter-common", optional = true }
medousa-mcp-gateway = { path = "adapters/medousa-mcp-gateway", optional = true }
medousa-install-support = { path = "crates/medousa-install-support", optional = true }
medousa-local-credential = { path = "crates/medousa-local-credential", optional = true }
medousa-secrets = { path = "crates/medousa-secrets", optional = true }
medousa-engine = { path = "crates/medousa-engine" }
medousa-runtime = { path = "crates/medousa-runtime" }
medousa-host = { path = "crates/medousa-host", optional = true }
medousa-store = { path = "crates/medousa-store" }
medousa-sdk = { path = "crates/medousa-sdk", optional = true }
medousa-acp-client = { path = "crates/medousa-acp-client", optional = true }
medousa-forge = { path = "crates/medousa-forge", optional = true }
detamu = { version = "0.1.1", default-features = false, features = ["code", "surreal"], optional = true }
detamu-source-git = { version = "0.1.1", optional = true }
detamu-language-rust = { version = "0.1.1", optional = true }
detamu-language = { version = "0.1.1", optional = true }
medousa-browser-lite = { path = "crates/medousa-browser-lite", optional = true }
medousa-local-inference = { path = "crates/medousa-local-inference", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", optional = true }
icalendar = { version = "0.17", default-features = true, features = ["chrono-tz"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart", "ws"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "blocking"], optional = true }
zeroize = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"] }
dirs = { version = "5", optional = true }
ratatui = { version = "0.30.0", optional = true }
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25.6", default-features = false, features = ["png"], optional = true }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
futures-util = { version = "0.3", optional = true }
stasis-rs = { version = "0.9.4", default-features = false }
grapheme-sdk = { version = "0.7.1", default-features = false, features = ["host"], optional = true }
grapheme-compiler = { version = "0.7.1", default-features = false, optional = true }
grapheme-runtime = { version = "0.7.1", default-features = false, optional = true }
grapheme-lsp = { version = "0.7.1", optional = true }
schemars = { version = "0.8", optional = true }
genai = "0.6.5"
locus-core-rs = { version = "0.5.1", default-features = false }
keyring = { version = "2.3", optional = true }
once_cell = "1"
surrealdb-types = { version = "3.1.5" }
surrealdb = { version = "3.1.5", default-features = false, features = ["kv-surrealkv", "rustls"] }
toml = { version = "0.8", optional = true }
serde_yaml = { version = "0.9", optional = true }
libc = { version = "0.2", optional = true }
sha2 = "0.10"
hmac = { version = "0.12", optional = true }
regex = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
rand = { version = "0.8", optional = true }
qrcode = { version = "0.14", optional = true }
a2 = { version = "0.10", default-features = false, features = ["ring"], optional = true }
mdns-sd = { version = "0.11", optional = true }
chacha20poly1305 = { version = "0.10", features = ["std"], optional = true }
urlencoding = { version = "2", optional = true }
sysinfo = { version = "0.33", optional = true }
fs2 = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
calamine = { version = "0.36", optional = true }
pdf-extract = { version = "0.12", optional = true }
iroh = { version = "1.0", optional = true }
iroh-tickets = { version = "1.0", optional = true }
httparse = { version = "1", optional = true }
medousa-iroh-http = { path = "crates/medousa-iroh-http", optional = true }
tower = { version = "0.5", features = ["util", "limit"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
vte = { version = "0.15", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"], optional = true }
notify = { version = "6", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"], optional = true }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
], optional = true }
rappct = { version = "0.13.3", optional = true }

[features]
default = ["full-daemon"]
full-daemon = [
    "medousa-types/json-schema",
    "stasis-rs/otel",
    "stasis-rs/grapheme-full",
    "surrealdb/kv-mem",
    "surrealdb/protocol-ws",
    "dep:medousa-api-contract",
    "dep:medousa-tool-macros",
    "dep:medousa-adapter-common",
    "dep:medousa-mcp-gateway",
    "dep:medousa-install-support",
    "dep:medousa-local-credential",
    "dep:medousa-secrets",
    "dep:medousa-host",
    "dep:medousa-sdk",
    "dep:medousa-acp-client",
    "dep:medousa-forge",
    "dep:detamu",
    "dep:detamu-source-git",
    "dep:detamu-language-rust",
    "dep:detamu-language",
    "dep:medousa-browser-lite",
    "dep:medousa-local-inference",
    "dep:clap",
    "dep:chrono-tz",
    "dep:icalendar",
    "dep:axum",
    "dep:reqwest",
    "dep:zeroize",
    "dep:dirs",
    "dep:ratatui",
    "dep:ratatui-image",
    "dep:image",
    "dep:crossterm",
    "dep:futures-util",
    "dep:grapheme-sdk",
    "dep:grapheme-compiler",
    "dep:grapheme-runtime",
    "dep:grapheme-lsp",
    "dep:schemars",
    "dep:keyring",
    "dep:toml",
    "dep:serde_yaml",
    "dep:libc",
    "dep:hmac",
    "dep:regex",
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:rand",
    "dep:qrcode",
    "dep:a2",
    "dep:mdns-sd",
    "dep:chacha20poly1305",
    "dep:urlencoding",
    "dep:sysinfo",
    "dep:fs2",
    "dep:flate2",
    "dep:calamine",
    "dep:pdf-extract",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio-tungstenite",
    "dep:vte",
    "dep:tracing-subscriber",
    "dep:notify",
    "dep:unicode-normalization",
    "dep:zip",
    "dep:windows",
    "dep:rappct",
]
embedded-daemon = [
    "medousa-types/json-schema",
    "dep:base64",
    "dep:chrono-tz",
    "dep:dirs",
    "dep:grapheme-compiler",
    "dep:grapheme-runtime",
    "dep:grapheme-sdk",
    "dep:hmac",
    "dep:icalendar",
    "dep:medousa-browser-lite",
    "dep:medousa-mcp-gateway",
    "dep:medousa-tool-macros",
    "dep:reqwest",
    "dep:schemars",
    "dep:serde_yaml",
    "dep:toml",
    "dep:unicode-normalization",
    "dep:zeroize",
]
otel-export = [
    "full-daemon",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
iroh-transport = ["full-daemon", "dep:iroh", "dep:iroh-tickets", "dep:httparse", "dep:medousa-iroh-http"]

[dev-dependencies]
medousa-mcp-server = { path = "crates/medousa-mcp-server" }
surrealdb-types = { version = "3.1.5" }
surrealdb = { version = "3.1.5", default-features = false, features = ["kv-mem"] }
tempfile = "3"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

# --- Local iteration speed -------------------------------------------------
# Debug info generation + dsymutil + linking dominate build time on a workspace
# this dependency-heavy. Keep line tables (backtraces still work) but drop the
# heavy DWARF, never emit debuginfo for dependencies, and skip dsymutil on macOS.
# These only affect the dev/test profile — release/shipped binaries are untouched.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# Cross-target qualification profile for the embedded iOS dependency graph.
# Staticlib probes need codegen and linking, but do not need the size or disk
# cost of release LTO or debug information.
[profile.ios-probe]
inherits = "release"
opt-level = "s"
debug = false
strip = "debuginfo"
lto = false
codegen-units = 16
incremental = false
panic = "abort"

[package.metadata.cargo-machete]
ignored = []
